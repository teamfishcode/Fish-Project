<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zebrafish Heart Rate Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f8;
      color: #222;
    }
    header {
      background-color: #234e70;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }
    header h1 { margin: 0; }
    nav {
      background-color: #16364f;
      padding: 12px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
    }
    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }
    section {
      background-color: white;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { color: #234e70; }
    h3 { margin-top: 25px; }
    .project-image {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 15px auto 5px auto;
    }
    .wide-image { max-width: 850px; }
    .caption {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 5px;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #555;
    }
    /* Timeline section */
.timeline-section {
    max-width: 850px;
    margin: 60px auto;
    padding: 20px;
}

.timeline-section h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 10px;
}

.timeline-intro {
    text-align: center;
    color: #666;
    margin-bottom: 50px;
}

/* Main timeline */
/* Main timeline */
.timeline {
    position: relative;
    padding-left: 40px;
}

/* Vertical line */
.timeline::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    width: 3px;
    background-color: #8da9c4;
}

/* Individual timeline items */
.timeline-item {
    position: relative;
    margin-bottom: 45px;
}

/* Circular markers ON the line */
.timeline-item::before {
    content: '';
    position: absolute;
    left: -38px;
    top: 5px;
    width: 16px;
    height: 16px;
    background-color: #8da9c4;
    border: 3px solid white;
    border-radius: 50%;
    z-index: 2;
}

/* Text positioned to the right of the marker */
.timeline-content {
    background-color: #f5f7fa;
    padding: 20px 25px;
    border-radius: 10px;
    margin-left: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* Dates */
.timeline-date {
    color: #6889aa;
    font-size: 14px;
    font-weight: bold;
}

.timeline-content h2 {
    margin: 8px 0;
    font-size: 21px;
}

.timeline-content p {
    color: #555;
    line-height: 1.6;
    margin-bottom: 0;
}

/* Mobile responsiveness */
@media (max-width: 600px) {
    .timeline-section {
        padding: 15px;
    }

    .timeline-content {
        padding: 15px;
    }

    .timeline-content h2 {
        font-size: 18px;
    }
}
  </style>
</head>
<body>
  <header>
    <h1>Zebrafish Heart Rate Group Project</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="project.html">Our Project</a>
    <a href="anatomy.html">Anatomy</a>
  </nav>

  <main>
    <section>
      <h2>Zebrafish Heart Rate Group Project</h2>
      <p>
        <a href="about.html">About</a> |
        <a href="project.html">Our Project</a> |
        <a href="anatomy.html">Anatomy</a>
      </p>
    </section>

<section class="timeline-section">
    <h1>Project Timeline</h1>
    <p class="timeline-intro">
        Follow the progress and key milestones of our project.
    </p>

    <div class="timeline">

        <!-- MILESTONE 1 -->
        <div class="timeline-item">
            <div class="timeline-content">
                <span class="timeline-date">September 2027</span>
                <h2>Project Beginnings</h2>
                <p>
                    Establishing the aims of our project.
                </p>
            </div>
        </div>

    </div>
</section>
    


  <footer>
    Fish Project
  </footer>
  <script>
document.addEventListener("DOMContentLoaded", function () {

    const figures = document.querySelectorAll(".figure");

    figures.forEach((figure, index) => {

        const caption = figure.querySelector("figcaption");

        // Automatically number figures
        caption.innerHTML =
            "Figure " + (index + 1) + ": " + caption.innerHTML;

        // Assign an ID for referencing
        figure.id = "fig-" + (index + 1);

    });

});
</script>
</body>
</html>
